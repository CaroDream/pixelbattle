name: One-time UI repair

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/one-time-ui-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair battlefield source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('const TILE_SIZE = 32;', 'const TILE_SIZE = 20;')
          s = s.replace('const ZOOM_STEP = 0.15;', 'const ZOOM_STEP = 0.25;')
          s = s.replace("const [zoom, setZoom] = useState(1);", "const [zoom, setZoom] = useState(() => typeof window !== 'undefined' && window.innerWidth < 768 ? 0.7 : 1);")
          s = s.replace("const [dark, setDark] = useState(true);", "const [dark, setDark] = useState(false);")
          old = """  useEffect(() => {\n    const savedDark = localStorage.getItem('pb_dark');\n    if (savedDark !== null) setDark(savedDark === 'true');\n    const savedSound = localStorage.getItem('pb_sound');"""
          new = """  useEffect(() => {\n    localStorage.setItem('pb_dark', 'false');\n    setDark(false);\n    const savedSound = localStorage.getItem('pb_sound');"""
          if old not in s:
              raise SystemExit('Expected theme initialization block was not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet || git commit -m "Fix zoom controls and mobile battlefield scale"
          git push
